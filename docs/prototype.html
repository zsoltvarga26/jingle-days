<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adventi kalendárium – prototípus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E4F3EC;
    --bg-2: #CFE9DE;
    --ink: #123C30;
    --ink-soft: #3F6B5D;
    --pine: #146B4E;
    --pine-dark: #0D4A36;
    --red: #E2384B;
    --red-dark: #A8202F;
    --pink: #FF9FB2;
    --gold: #F5BE3A;
    --gold-dark: #C98E12;
    --snow: #FFFFFF;
    --inside: #FFF6DC;
    --inside-ink: #B3261E;
    --shadow: rgba(13, 74, 54, .22);
    --flake: #FFFFFF;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B2A22;
      --bg-2: #103A2E;
      --ink: #F3FBF7;
      --ink-soft: #A9CFC1;
      --pine: #1F8A63;
      --pine-dark: #13573F;
      --inside: #2A1F12;
      --inside-ink: #F5BE3A;
      --shadow: rgba(0, 0, 0, .45);
      --flake: #DDF2EA;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B2A22;
    --bg-2: #103A2E;
    --ink: #F3FBF7;
    --ink-soft: #A9CFC1;
    --pine: #1F8A63;
    --pine-dark: #13573F;
    --inside: #2A1F12;
    --inside-ink: #F5BE3A;
    --shadow: rgba(0, 0, 0, .45);
    --flake: #DDF2EA;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(circle at 15% 0%, var(--bg-2) 0, transparent 45%),
      radial-gradient(circle at 90% 30%, var(--bg-2) 0, transparent 40%),
      var(--bg);
    color: var(--ink);
    font-family: "Baloo 2", "Nunito", "Trebuchet MS", system-ui, sans-serif;
    overflow-x: hidden;
    counter-reset: opened;
  }

  /* ---------- Hóesés ---------- */
  .snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .snow i {
    position: absolute;
    top: -12px;
    left: var(--x);
    width: var(--s);
    height: var(--s);
    border-radius: 50%;
    background: var(--flake);
    opacity: .85;
    box-shadow: 0 0 6px rgba(255,255,255,.6);
    animation: fall var(--d) linear var(--w) infinite;
  }
  @keyframes fall {
    0%   { transform: translate(0, -10vh); }
    50%  { transform: translate(24px, 50vh); }
    100% { transform: translate(-12px, 110vh); }
  }

  /* ---------- Fejléc ---------- */
  main {
    position: relative;
    z-index: 1;
    max-width: 1080px;
    margin: 0 auto;
    padding: clamp(1.5rem, 4vw, 3rem) clamp(1rem, 4vw, 2.5rem) 3rem;
  }
  header { text-align: center; margin-bottom: clamp(1.5rem, 4vw, 2.5rem); }
  h1 {
    margin: 0;
    font-weight: 800;
    font-size: clamp(2.6rem, 9vw, 5.6rem);
    line-height: .95;
    letter-spacing: -.02em;
    color: var(--red);
    text-shadow:
      3px 3px 0 var(--gold),
      6px 6px 0 var(--pine);
    animation: wobble 4s ease-in-out infinite;
    display: inline-block;
  }
  @keyframes wobble {
    0%, 100% { transform: rotate(-2deg); }
    50%      { transform: rotate(2deg); }
  }
  .lead {
    margin: 1.2rem auto 0;
    max-width: 34ch;
    font-size: clamp(1.05rem, 2.4vw, 1.3rem);
    line-height: 1.4;
    color: var(--ink-soft);
    font-weight: 500;
  }

  /* ---------- Rács ---------- */
  .calendar {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
    grid-auto-rows: 120px;
    grid-auto-flow: dense;
    gap: clamp(.6rem, 1.6vw, 1rem);
    padding: clamp(.8rem, 2vw, 1.4rem);
    border-radius: 28px;
    background: var(--pine);
    box-shadow: 0 18px 40px var(--shadow), inset 0 0 0 6px var(--pine-dark);
  }
  .wide { grid-column: span 2; }
  .tall { grid-row: span 2; }
  .big  { grid-column: span 2; grid-row: span 2; }

  /* ---------- Ablak ---------- */
  .day {
    position: relative;
    display: block;
    perspective: 900px;
    cursor: pointer;
    border-radius: 16px;
    -webkit-tap-highlight-color: transparent;
  }
  .day input {
    position: absolute;
    opacity: 0;
    width: 1px; height: 1px;
    pointer-events: none;
  }
  .day input:checked { counter-increment: opened; }

  /* ami a kis ajtó mögött van */
  .inside {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    background:
      radial-gradient(circle at 50% 45%, rgba(245,190,58,.35), transparent 65%),
      var(--inside);
    box-shadow: inset 0 4px 14px rgba(0,0,0,.25);
    display: grid;
    place-items: center;
    color: var(--inside-ink);
    font-weight: 800;
    font-size: clamp(2.6rem, 6vw, 3.4rem);
    line-height: 1;
    overflow: hidden;
  }
  .big .inside { font-size: clamp(4.5rem, 12vw, 7rem); }
  .inside span { transform: scale(.3); opacity: 0; }
  .day input:checked ~ .inside span {
    animation: pop .6s cubic-bezier(.3, 1.6, .5, 1) .25s forwards;
  }
  @keyframes pop {
    to { transform: scale(1); opacity: 1; }
  }
  /* csillámok nyitáskor */
  .inside::before, .inside::after {
    content: "";
    position: absolute;
    width: 10px; height: 10px;
    background: var(--gold);
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
    opacity: 0;
  }
  .inside::before { top: 18%; left: 20%; }
  .inside::after  { bottom: 20%; right: 18%; width: 14px; height: 14px; }
  .day input:checked ~ .inside::before { animation: twinkle 1.8s ease-in-out .5s infinite; }
  .day input:checked ~ .inside::after  { animation: twinkle 1.8s ease-in-out 1.1s infinite; }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(.4) rotate(0); }
    50%      { opacity: 1; transform: scale(1.2) rotate(45deg); }
  }

  /* az ajtó */
  .door {
    position: absolute;
    inset: 0;
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform .8s cubic-bezier(.5, 0, .2, 1.2);
    border-radius: 16px;
  }
  .front, .back {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .front {
    background-color: var(--c);
    background-image: var(--p);
    background-size: var(--ps, 22px 22px);
    box-shadow: 0 6px 0 var(--cd), 0 10px 18px var(--shadow);
    display: flex;
    align-items: flex-end;
    justify-content: flex-start;
    padding: .55rem .7rem;
    overflow: hidden;
  }
  /* szalag */
  .front::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, transparent calc(50% - 7px), var(--r) calc(50% - 7px), var(--r) calc(50% + 7px), transparent calc(50% + 7px)),
      linear-gradient(0deg, transparent calc(50% - 7px), var(--r) calc(50% - 7px), var(--r) calc(50% + 7px), transparent calc(50% + 7px));
    opacity: var(--ribbon, 0);
  }
  /* kilincs */
  .front::after {
    content: "";
    position: absolute;
    right: 10px;
    top: 50%;
    width: 9px; height: 9px;
    margin-top: -4.5px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 2px 0 var(--gold-dark);
  }
  .num {
    position: relative;
    z-index: 1;
    min-width: 2.1em;
    padding: .1em .45em 0;
    border-radius: 999px;
    background: var(--snow);
    color: var(--red-dark);
    font-weight: 800;
    font-size: 1.15rem;
    line-height: 1.5;
    text-align: center;
    box-shadow: 0 2px 0 rgba(0,0,0,.15);
  }
  .big .num { font-size: 1.6rem; }
  .back {
    transform: rotateY(180deg);
    background: var(--cd);
    box-shadow: inset -6px 0 0 rgba(0,0,0,.15);
  }

  /* interakciók */
  @media (hover: hover) {
    .day:hover input:not(:checked) ~ .door { transform: rotateY(-14deg); }
  }
  .day input:checked ~ .door { transform: rotateY(-112deg); }
  .day input:focus-visible ~ .door .front {
    outline: 4px solid var(--gold);
    outline-offset: 3px;
  }
  .day input:checked ~ .door .front::after { background: var(--snow); }

  /* ajtószínek és csomagolópapír-minták */
  .c-red   { --c: var(--red);  --cd: var(--red-dark);  --r: var(--gold); }
  .c-gold  { --c: var(--gold); --cd: var(--gold-dark); --r: var(--red); }
  .c-snow  { --c: #FFFFFF;     --cd: #C9DCD4;          --r: var(--red); }
  .c-pink  { --c: var(--pink); --cd: #D9667F;          --r: var(--pine); }
  .c-green { --c: #2FA374;     --cd: #1B6E4D;          --r: var(--gold); }

  .p-dots    { --p: radial-gradient(circle, rgba(255,255,255,.55) 3px, transparent 3.5px); --ps: 20px 20px; }
  .p-stripes { --p: repeating-linear-gradient(45deg, rgba(255,255,255,.35) 0 8px, transparent 8px 18px); --ps: auto; }
  .p-candy   { --p: repeating-linear-gradient(-45deg, rgba(226,56,75,.55) 0 9px, transparent 9px 20px); --ps: auto; }
  .p-check   { --p: conic-gradient(rgba(255,255,255,.25) 25%, transparent 0 50%, rgba(255,255,255,.25) 0 75%, transparent 0); --ps: 24px 24px; }
  .p-plain   { --p: none; }
  .ribbon    { --ribbon: 1; }

  /* ---------- Visszaszámláló ---------- */
  .countdown {
    margin: 1.6rem auto 0;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: .5rem;
  }
  .countdown-title {
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--pine);
  }
  .clock { display: flex; gap: clamp(.4rem, 1.5vw, .7rem); }
  .unit {
    min-width: clamp(4rem, 15vw, 5.2rem);
    padding: .45rem .4rem .3rem;
    border-radius: 18px;
    background: var(--snow);
    box-shadow: 0 5px 0 var(--red), 0 10px 20px var(--shadow);
    text-align: center;
  }
  .unit b {
    display: block;
    font-weight: 800;
    font-size: clamp(1.8rem, 5.5vw, 2.6rem);
    line-height: 1;
    color: var(--red-dark);
    font-variant-numeric: tabular-nums;
  }
  .unit small {
    display: block;
    font-size: .9rem;
    font-weight: 600;
    color: #3F6B5D;
  }
  .unit.tick b { animation: tick .35s ease-out; }
  @keyframes tick {
    from { transform: translateY(-4px) scale(1.12); }
    to   { transform: none; }
  }
  .merry {
    font-weight: 800;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    color: var(--red);
  }

  /* visszaállított (korábban kinyitott) ablakok animáció nélkül */
  .no-anim .door { transition: none; }
  .restored input:checked ~ .inside span { animation: none; transform: none; opacity: 1; }

  /* ---------- Számláló ---------- */
  .progress {
    margin-top: 1.6rem;
    text-align: center;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .progress::after {
    content: counter(opened) " / 24 ablak nyitva";
    display: inline-block;
    padding: .3em 1em .15em;
    border-radius: 999px;
    background: var(--snow);
    color: var(--pine-dark);
    box-shadow: 0 4px 0 var(--bg-2);
  }

  /* ---------- Betöltéskori belépés: egyetlen összehangolt pillanat ---------- */
  .day {
    animation: drop .7s cubic-bezier(.3, 1.4, .5, 1) both;
    animation-delay: calc(var(--i) * 45ms);
  }
  @keyframes drop {
    from { opacity: 0; transform: translateY(-30px) scale(.85); }
    to   { opacity: 1; transform: none; }
  }

  .reset-wrap { text-align: center; margin: 1rem 0 0; }
  .reset {
    font: inherit;
    font-weight: 600;
    font-size: 1rem;
    padding: .45em 1.2em .3em;
    border: 2px solid var(--pine);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  .reset:hover { background: var(--pine); color: #FFFFFF; }
  .reset:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }

  @media (max-width: 520px) {
    .calendar { grid-template-columns: repeat(3, 1fr); grid-auto-rows: 104px; }
    .big { grid-column: span 2; }
  }

  @media (prefers-reduced-motion: reduce) {
    .snow, h1 { animation: none; }
    .snow i { display: none; }
    .day { animation: none; }
    .door { transition-duration: .01ms; }
    .inside span { transform: none; opacity: 1; }
    .unit.tick b { animation: none; }
    .day input:checked ~ .inside span,
    .day input:checked ~ .inside::before,
    .day input:checked ~ .inside::after { animation: none; }
  }
</style>
</head>
<body>

<div class="snow" aria-hidden="true">
  <i style="--x:3%;--s:6px;--d:11s;--w:-2s"></i>
  <i style="--x:9%;--s:4px;--d:14s;--w:-7s"></i>
  <i style="--x:14%;--s:8px;--d:9s;--w:-4s"></i>
  <i style="--x:20%;--s:5px;--d:13s;--w:-10s"></i>
  <i style="--x:26%;--s:7px;--d:10s;--w:-1s"></i>
  <i style="--x:31%;--s:4px;--d:15s;--w:-8s"></i>
  <i style="--x:37%;--s:6px;--d:12s;--w:-5s"></i>
  <i style="--x:43%;--s:9px;--d:9s;--w:-3s"></i>
  <i style="--x:48%;--s:5px;--d:14s;--w:-11s"></i>
  <i style="--x:54%;--s:7px;--d:11s;--w:-6s"></i>
  <i style="--x:59%;--s:4px;--d:13s;--w:-2s"></i>
  <i style="--x:65%;--s:8px;--d:10s;--w:-9s"></i>
  <i style="--x:70%;--s:5px;--d:15s;--w:-4s"></i>
  <i style="--x:76%;--s:6px;--d:12s;--w:-7s"></i>
  <i style="--x:81%;--s:9px;--d:9s;--w:-1s"></i>
  <i style="--x:87%;--s:4px;--d:14s;--w:-12s"></i>
  <i style="--x:92%;--s:7px;--d:11s;--w:-5s"></i>
  <i style="--x:97%;--s:5px;--d:13s;--w:-3s"></i>
  <i style="--x:6%;--s:3px;--d:16s;--w:-13s"></i>
  <i style="--x:34%;--s:3px;--d:17s;--w:-6s"></i>
  <i style="--x:62%;--s:3px;--d:16s;--w:-14s"></i>
  <i style="--x:84%;--s:3px;--d:18s;--w:-9s"></i>
</div>

<main>
  <header>
    <h1>Advent 2026</h1>
    <p class="lead">Minden nap egy új ablak. Kattints rá, és nézd meg, mi lapul mögötte!</p>
    <div class="countdown" id="countdown" aria-live="off">
      <div class="countdown-title" id="cd-title">Szentestéig még</div>
      <div class="clock" id="cd-clock">
        <div class="unit"><b id="cd-d">–</b><small>nap</small></div>
        <div class="unit"><b id="cd-h">–</b><small>óra</small></div>
        <div class="unit"><b id="cd-m">–</b><small>perc</small></div>
        <div class="unit"><b id="cd-s">–</b><small>másodperc</small></div>
      </div>
    </div>
  </header>

  <section class="calendar" aria-label="Adventi kalendárium, 24 ablak">
    <label class="day" style="--i:0"><input type="checkbox" aria-label="13. ablak"><span class="inside"><span>13</span></span><span class="door"><span class="front c-red p-dots"><span class="num">13</span></span><span class="back"></span></span></label>
    <label class="day" style="--i:1"><input type="checkbox" aria-label="4. ablak"><span class="inside"><span>4</span></span><span class="door"><span class="front c-snow p-candy"><span class="num">4</span></span><span class="back"></span></span></label>
    <label class="day tall" style="--i:2"><input type="checkbox" aria-label="21. ablak"><span class="inside"><span>21</span></span><span class="door"><span class="front c-gold p-stripes ribbon"><span class="num">21</span></span><span class="back"></span></span></label>
    <label class="day" style="--i:3"><input type="checkbox" aria-label="8. ablak"><span class="inside"><span>8</span></span><span class="door"><span class="front c-green p-check"><span class="num">8</span></span><span class="back"></span></span></label>
    <label class="day" style="--i:4"><input type="checkbox" aria-label="1. ablak"><span class="inside"><span>1</span></span><span class="door"><span class="front c-pink p-dots"><span class="num">1</span></span><span class="back"></span></span></label>
    <label class="day" style="--i:5"><input type="checkbox" aria-label="17. ablak"><span class="inside"><span>17</span></span><span class="door"><span class="front c-red p-stripes"><span class="num">17</span></span><span class="back"></span></span></label>
    <label class="day wide" style="--i:6"><input type="checkbox" aria-label="6. ablak"><span class="inside"><span>6</span></span><span class="door"><span class="front c-red p-plain ribbon"><span class="num">6</span></span><span class="back"></span></span></label>
    <label class="day" style="--i:7"><input type="checkbox" aria-label="11. ablak"><span class="inside"><span>11</span></span><span class="door"><span class="front c-snow p-check"><span class="num">11</span></span><span class="back"></span></span></label>
    <label class="day big" style="--i:8"><input type="checkbox" aria-label="24. ablak"><span class="inside"><span>24</span></span><span class="door"><span class="front c-gold p-dots ribbon"><span class="num">24</span></span><span class="back"></span></span></label>
    <label class="day" style="--i:9"><input type="checkbox" aria-label="2. ablak"><span class="inside"><span>2</span></span><span class="door"><span class="front c-green p-stripes"><span class="num">2</span></span><span class="back"></span></span></label>
    <label class="day" style="--i:10"><input type="checkbox" aria-label="19. ablak"><span class="inside"><span>19</span></span><span class="door"><span class="front c-pink p-check"><span class="num">19</span></span><span class="back"></span></span></label>
    <label class="day" style="--i:11"><input type="checkbox" aria-label="9. ablak"><span class="inside"><span>9</span></span><span class="door"><span class="front c-red p-check"><span class="num">9</span></span><span class="back"></span></span></label>
    <label class="day wide" style="--i:12"><input type="checkbox" aria-label="15. ablak"><span class="inside"><span>15</span></span><span class="door"><span class="front c-snow p-candy ribbon"><span class="num">15</span></span><span class="back"></span></span></label>
    <label class="day" style="--i:13"><input type="checkbox" aria-label="3. ablak"><span class="inside"><span>3</span></span><span class="door"><span class="front c-gold p-check"><span class="num">3</span></span><span class="back"></span></span></label>
    <label class="day" style="--i:14"><input type="checkbox" aria-label="22. ablak"><span class="inside"><span>22</span></span><span class="door"><span class="front c-green p-dots"><span class="num">22</span></span><span class="back"></span></span></label>
    <label class="day tall" style="--i:15"><input type="checkbox" aria-label="12. ablak"><span class="inside"><span>12</span></span><span class="door"><span class="front c-pink p-stripes ribbon"><span class="num">12</span></span><span class="back"></span></span></label>
    <label class="day" style="--i:16"><input type="checkbox" aria-label="7. ablak"><span class="inside"><span>7</span></span><span class="door"><span class="front c-red p-plain"><span class="num">7</span></span><span class="back"></span></span></label>
    <label class="day" style="--i:17"><input type="checkbox" aria-label="18. ablak"><span class="inside"><span>18</span></span><span class="door"><span class="front c-snow p-dots"><span class="num">18</span></span><span class="back"></span></span></label>
    <label class="day" style="--i:18"><input type="checkbox" aria-label="5. ablak"><span class="inside"><span>5</span></span><span class="door"><span class="front c-gold p-stripes"><span class="num">5</span></span><span class="back"></span></span></label>
    <label class="day" style="--i:19"><input type="checkbox" aria-label="14. ablak"><span class="inside"><span>14</span></span><span class="door"><span class="front c-green p-candy"><span class="num">14</span></span><span class="back"></span></span></label>
    <label class="day" style="--i:20"><input type="checkbox" aria-label="10. ablak"><span class="inside"><span>10</span></span><span class="door"><span class="front c-pink p-plain"><span class="num">10</span></span><span class="back"></span></span></label>
    <label class="day wide" style="--i:21"><input type="checkbox" aria-label="23. ablak"><span class="inside"><span>23</span></span><span class="door"><span class="front c-green p-stripes ribbon"><span class="num">23</span></span><span class="back"></span></span></label>
    <label class="day" style="--i:22"><input type="checkbox" aria-label="16. ablak"><span class="inside"><span>16</span></span><span class="door"><span class="front c-red p-candy"><span class="num">16</span></span><span class="back"></span></span></label>
    <label class="day" style="--i:23"><input type="checkbox" aria-label="20. ablak"><span class="inside"><span>20</span></span><span class="door"><span class="front c-snow p-stripes"><span class="num">20</span></span><span class="back"></span></span></label>
  </section>

  <p class="progress" aria-live="polite"></p>
  <p class="reset-wrap"><button type="button" class="reset" id="reset">Összes ablak bezárása</button></p>
</main>

<script>
(function () {
  /* ----- Kinyitott ablakok megőrzése ----- */
  var KEY = 'advent-2026-opened';
  var days = Array.prototype.slice.call(document.querySelectorAll('.day'));
  var dayOf = function (label) { return label.querySelector('.inside span').textContent.trim(); };

  var saved = [];
  try { saved = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { saved = []; }
  if (!Array.isArray(saved)) saved = [];

  document.body.classList.add('no-anim');
  days.forEach(function (label) {
    if (saved.indexOf(dayOf(label)) !== -1) {
      label.classList.add('restored');
      label.querySelector('input').checked = true;
    }
  });
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { document.body.classList.remove('no-anim'); });
  });

  function save() {
    var opened = days.filter(function (l) { return l.querySelector('input').checked; }).map(dayOf);
    try { localStorage.setItem(KEY, JSON.stringify(opened)); } catch (e) {}
  }

  days.forEach(function (label) {
    label.querySelector('input').addEventListener('change', function (ev) {
      if (!ev.target.checked) label.classList.remove('restored');
      save();
    });
  });

  document.getElementById('reset').addEventListener('click', function () {
    days.forEach(function (label) {
      label.querySelector('input').checked = false;
      label.classList.remove('restored');
    });
    save();
  });

  /* ----- Visszaszámláló Szentestéig (dec. 24. 00:00, helyi idő) ----- */
  var els = {
    d: document.getElementById('cd-d'), h: document.getElementById('cd-h'),
    m: document.getElementById('cd-m'), s: document.getElementById('cd-s')
  };
  var prev = {};
  function target(now) {
    var y = now.getFullYear();
    var t = new Date(y, 11, 24, 0, 0, 0);
    if (now >= new Date(y, 11, 27)) t = new Date(y + 1, 11, 24, 0, 0, 0);
    return t;
  }
  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function set(key, val) {
    if (prev[key] === val) return;
    prev[key] = val;
    els[key].textContent = val;
    var unit = els[key].parentNode;
    unit.classList.remove('tick');
    void unit.offsetWidth;
    unit.classList.add('tick');
  }
  function update() {
    var now = new Date();
    var diff = target(now) - now;
    if (diff <= 0) {
      document.getElementById('countdown').innerHTML = '<div class="merry">Boldog karácsonyt! 🎄</div>';
      clearInterval(timer);
      return;
    }
    var sec = Math.floor(diff / 1000);
    set('d', String(Math.floor(sec / 86400)));
    set('h', pad(Math.floor(sec % 86400 / 3600)));
    set('m', pad(Math.floor(sec % 3600 / 60)));
    set('s', pad(sec % 60));
  }
  var timer = setInterval(update, 1000);
  update();
})();
</script>

</body>
</html>
